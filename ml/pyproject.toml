[project]
name = "ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shinya-Taketani", email = "taketani.servicecreate@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "lightgbm>=4.7.0",
    "polars>=1.44.2",
    "psycopg[binary]>=3.3.5",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.53.0",
]

[project.scripts]
ml = "ml:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
